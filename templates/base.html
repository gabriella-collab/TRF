<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}TRF · Fall 2026{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='logo.svg') }}"></head><body>{% if session.authenticated %}<header><a class="brand" href="{{ url_for('home') }}" aria-label="TRF homepage"><img src="{{ url_for('static',filename='logo.svg') }}" alt="TRF" width="64" height="64"></a><nav aria-label="Main"><a href="{{ url_for('updates') }}">Updates</a><a href="{{ url_for('home') }}#crew">The crew</a><a href="{{ url_for('gratitude') }}">Gratitude</a><a href="{{ url_for('halloween') }}">Halloween</a><a href="{{ url_for('editions') }}">Editions</a><a href="{{ url_for('camp') }}">Camp 2027</a></nav><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="text-button">Log out</button></form></header>{% endif %}<main>{% for message in get_flashed_messages() %}<div class="message" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>TRF · A private place for our shared stories.<span>Fall 2026</span></footer></body></html>
