{% extends 'base.html' %}{% block content %}<div class="page-heading"><p class="label">Group notes + upcoming dates</p><h1>TRF <em>Updates.</em></h1><p>The things we want everyone to know.</p></div><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="field-grid">{% for key,label in fields %}<div class="card"><label for="{{ key }}">{{ label }}</label><textarea id="{{ key }}" name="{{ key }}" rows="7" maxlength="5000" placeholder="Give us the group scoop…">{{ answers.get(key,'') }}</textarea></div>{% endfor %}</div><div class="save-bar"><p>These notes are shared with the whole crew.</p><button>Save group updates ↗</button></div></form>{% endblock %}
