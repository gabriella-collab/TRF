services:
  - type: web
    name: trf
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: TRF_DATA_DIR
        value: /var/data/trf
      - key: TRF_SECURE_COOKIES
        value: "1"
      - key: TRF_PASSWORD
        sync: false
    disk:
      name: trf-private-data
      mountPath: /var/data
      sizeGB: 1
